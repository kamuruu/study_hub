<!-- core/templates/core/home.html -->
<!DOCTYPE html>
<html lang="en">
<!-- core/templates/core/home.html -->
{% extends 'core/base.html' %}

{% block content %}
    <h1>Welcome back, {{ username }}!</h1>
    <p>You currently have {{ active_courses }} courses in progress.</p>
    
    <h3>Upcoming Study Topics:</h3>
    <ul>
        {% for topic in topics %}
            <li>{{ topic }}</li>
        {% endfor %}
    </ul>
{% endblock %}
</html>
