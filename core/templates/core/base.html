<!-- core/templates/core/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Hub</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        nav { background: #333; padding: 15px; color: white; }
        nav a { color: white; margin-right: 15px; text-decoration: none; font-weight: bold; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; }
    </style>
</head>
<body>
    <nav>
        <!-- Django's url tag dynamically generates the correct link based on the route name -->
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Child templates will insert their content here -->
        {% endblock %}
    </div>
</body>
</html>
